<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Habits</title>
  <meta name="description" content="Personal habit tracker with Greek NT reading progress">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📖</text></svg>">
  <link rel="manifest" href="./manifest.webmanifest">
  <meta name="theme-color" content="#fcfcfb" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <div class="app">
    <header class="app-header">
      <div class="brand">
        <span class="brand-icon" aria-hidden="true">📖</span>
        <h1>Habits</h1>
      </div>
      <div class="header-right">
        <span id="sync-dot" class="sync-dot" hidden title=""></span>
        <nav class="tabs" role="tablist" aria-label="Sections">
          <button class="tab is-active" role="tab" aria-selected="true" data-tab="dashboard">Habits</button>
          <button class="tab" role="tab" aria-selected="false" data-tab="gnt">Greek NT</button>
          <button class="tab" role="tab" aria-selected="false" data-tab="settings">Settings</button>
        </nav>
      </div>
    </header>

    <main>
      <section id="tab-dashboard" class="tab-panel" role="tabpanel"></section>
      <section id="tab-gnt" class="tab-panel" role="tabpanel" hidden></section>
      <section id="tab-settings" class="tab-panel" role="tabpanel" hidden></section>
    </main>

    <footer class="app-footer">
      <span id="footer-note"></span>
    </footer>
  </div>

  <div id="tooltip" class="tooltip" role="status" hidden></div>
  <div id="modal-root"></div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
